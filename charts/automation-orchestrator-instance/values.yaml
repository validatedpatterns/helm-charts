# -- Namespace for the AutomationOrchestrator resource. The namespace itself is created outside this chart.
namespace: automation-orchestrator

# -- Name of the AutomationOrchestrator resource.
name: orchestrator

global:
  # -- Domain used in the OpenShift console link for the orchestrator route.
  hubClusterDomain: example.com

secretStore:
  # -- External Secrets store used to project database credentials.
  name: vault-backend
  # -- External Secrets store kind.
  kind: ClusterSecretStore

# Database credentials are projected with ExternalSecret resources using the
# same pattern as vp-cloudnative-pg-cluster. Patterns supply or generate the
# backing material through values-secret (default onMissingValue: generate).
#
# With postgres.provider=cloudnative, backend/temporal Secrets are projected by
# vp-cloudnative-pg-cluster for Cluster bootstrap. This chart then only projects
# secrets.additional unless secrets.includeDatabaseSecrets is true.
# With postgres.provider=external, backend/temporal Secrets are projected here.
secrets:
  # -- Create ExternalSecret resources for database credentials.
  enabled: true
  # -- Also project backend/temporal Secrets when provider is cloudnative.
  # Defaults to false so vp-cloudnative-pg-cluster owns those ExternalSecrets.
  includeDatabaseSecrets: false
  # -- Vault (or other backend) key prefix used by ExternalSecret remote refs.
  # Patterns typically use secret/data/hub/<name> with the vault backend.
  keyPrefix: secret/data/hub
  # -- Refresh interval for ExternalSecret resources.
  refreshInterval: 15s
  # -- Argo CD sync-wave for ExternalSecret resources so credentials exist
  # before the AutomationOrchestrator is applied. Avoid negative waves.
  syncWave: "0"
  # -- Extra Secret names to project beyond backend/temporal defaults.
  additional: []

postgres:
  # -- PostgreSQL provider. cloudnative connects to the CloudNativePG cluster from the vp-cloudnative-pg-cluster chart. external uses an existing PostgreSQL 15 instance.
  provider: cloudnative
  # -- CloudNativePG cluster name used to derive the service hostname and CA secret. Must match fullnameOverride / cluster name in the vp-cloudnative-pg-cluster chart.
  clusterName: orchestrator-postgres
  # -- PostgreSQL hostname. Required when provider is external. Empty with cloudnative uses the CloudNativePG read-write service.
  host: ""
  # -- PostgreSQL port.
  port: 5432
  # -- PostgreSQL SSL mode. Empty selects verify-ca for cloudnative and require for external.
  sslMode: ""
  # -- Secret containing backend database keys database, username, and password. Empty selects the provider default.
  backendDatabaseSecret: ""
  # -- Secret containing Temporal database keys database, username, and password. Empty selects the provider default.
  temporalDatabaseSecret: ""
  # -- Secret containing the PostgreSQL CA certificate in key ca.crt. Empty with cloudnative uses the CloudNativePG cluster CA secret.
  caCertSecret: ""

ingress:
  # -- Ingress type for automation orchestrator. Route is the OpenShift default.
  type: Route
  # -- Optional ingress hostname. Empty lets OpenShift assign the route host.
  host: ""
